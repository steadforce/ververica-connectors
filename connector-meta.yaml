# connector-meta.yaml
connector:
  type: oracle-cdc
  packaged: true
  source: true
  sink: true
  lookup: false
  properties:
  - key: connector
    required: true
    description: Must be set to 'oracle-cdc' to configure this connector.
  - key: hostname
    required: false
    description: IP address or hostname of the Oracle database server. If the url is not empty, hostname may not be configured, otherwise hostname can not be empty
  - key: username
    required: true
    description: Name of the Oracle database to use when connecting to the Oracle database server.
  - key: password
    required: true
    description: Password to use when connecting to the Oracle database server.
  - key: database-name
    required: true
    description: Database name of the Oracle server to monitor.
  - key: schema-name
    required: true
    description: Schema name of the Oracle database to monitor.
  - key: table-name
    required: true
    description: Table name of the Oracle database to monitor.
  - key: port
    required: false
    defaultValue: 1521
    description: Integer port number of the Oracle database server.
  - key: url
    required: false
    defaultValue: jdbc:oracle:thin:@{hostname}:{port}:{database-name}
    description: JdbcUrl of the oracle database server . If the hostname and port parameter is configured, the URL is concatenated by hostname port database-name in SID format by default. Otherwise, you need to configure the URL parameter
  - key: scan.startup.mode
    required: false
    defaultValue: initial
    description: Optional startup mode for Oracle CDC consumer, valid enumerations are 'initial' and 'latest-offset'. Please see Startup Reading Position section for more detailed information.
  - key: scan.incremental.snapshot.enabled
    required: false
    defaultValue: true
    description: "Incremental snapshot is a new mechanism to read snapshot of a table. Compared to the old snapshot mechanism, the incremental snapshot has many advantages, including: (1) source can be parallel during snapshot reading, (2) source can perform checkpoints in the chunk granularity during snapshot reading, (3) source doesn't need to acquire ROW SHARE MODE lock before snapshot reading."
  - key: scan.incremental.snapshot.chunk.size
    required: false
    defaultValue: 8096
    description: The chunk size (number of rows) of table snapshot, captured tables are split into multiple chunks when read the snapshot of table.
  - key: scan.snapshot.fetch.size
    required: false
    defaultValue: 1024
    description: The maximum fetch size for per poll when read table snapshot.
  - key: connect.max-retries
    required: false
    defaultValue: 3
    description: The max retry times that the connector should retry to build Oracle database server connection.
  - key: connection.pool.size
    required: false
    defaultValue: 20
  - key: debezium.*
    required: false
    description: "Pass-through Debezium's properties to Debezium Embedded Engine which is used to capture data changes from Oracle server. For example: 'debezium.snapshot.mode' = 'never'. See more about the Debezium's Oracle Connector properties"
  - key: scan.incremental.close-idle-reader.enabled
    required: false
    defaultValue: false
    description: Whether to close idle readers at the end of the snapshot phase. The flink version is required to be greater than or equal to 1.14 when 'execution.checkpointing.checkpoints-after-tasks-finish.enabled' is set to true. If the flink version is greater than or equal to 1.15, the default value of 'execution.checkpointing.checkpoints-after-tasks-finish.enabled' has been changed to true, so it does not need to be explicitly configured 'execution.checkpointing.checkpoints-after-tasks-finish.enabled' = 'true' 
  - key: scan.incremental.snapshot.chunk.key-column
    required: false
    description: The chunk key of table snapshot, captured tables are split into multiple chunks by a chunk key when read the snapshot of table. By default, the chunk key is 'ROWID'. This column must be a column of the primary key.

  